<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stellar Ticket Manager</title>
    <meta name="description" content="Decentralized Ticket Management on Stellar Soroban">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Background Elements for Premium Look -->
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>
    
    <nav class="navbar">
        <div class="logo">
            <div class="logo-icon"></div>
            <span>StellarTickets</span>
        </div>
        <div class="nav-actions">
            <span id="networkBadge" class="badge network-badge hidden">Testnet</span>
            <button id="connectWalletBtn" class="btn btn-primary glass">Connect Freighter</button>
        </div>
    </nav>

    <main class="container">
        <header class="hero">
            <h1 class="gradient-text">Decentralized Ticketing</h1>
            <p>Manage, claim, and track tasks directly on the Stellar blockchain.</p>
            
            <div id="initSection" class="init-section hidden glass-panel">
                <p>Contract not initialized.</p>
                <button id="initContractBtn" class="btn btn-secondary">Initialize Contract</button>
            </div>
        </header>

        <!-- Owner Dashboard (Hidden by default) -->
        <section id="ownerDashboard" class="dashboard-section hidden">
            <div class="section-header">
                <h2>Admin Controls</h2>
                <span class="badge role-badge">Owner</span>
            </div>
            
            <div class="glass-panel form-panel">
                <h3>Create New Ticket</h3>
                <form id="createTicketForm">
                    <div class="form-group">
                        <label for="ticketTitle">Ticket Title</label>
                        <input type="text" id="ticketTitle" placeholder="e.g., Fix Navigation Bug" required>
                    </div>
                    <div class="form-group">
                        <label for="ticketDescription">Description</label>
                        <textarea id="ticketDescription" rows="3" placeholder="Provide details about the issue..." required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary" id="submitTicketBtn">
                        <span class="btn-text">Create Ticket</span>
                        <span class="loader hidden"></span>
                    </button>
                </form>
            </div>
        </section>

        <!-- Tickets List -->
        <section class="dashboard-section">
            <div class="section-header">
                <h2>Available Tickets</h2>
                <div class="controls">
                    <button id="refreshBtn" class="btn btn-icon" title="Refresh Tickets">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path></svg>
                    </button>
                </div>
            </div>

            <div id="ticketsContainer" class="tickets-grid">
                <!-- Tickets will be injected here via JS -->
            </div>
            
            <div id="emptyState" class="empty-state">
                <div class="empty-icon">🎟️</div>
                <h3>No tickets found</h3>
                <p>There are currently no tickets available on the network.</p>
            </div>
        </section>
    </main>

    <!-- Notification Toast -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- Template for a Ticket Card -->
    <template id="ticketTemplate">
        <div class="ticket-card glass-panel">
            <div class="ticket-header">
                <span class="ticket-id">#<span class="t-id"></span></span>
                <span class="ticket-status badge"></span>
            </div>
            <h3 class="ticket-title"></h3>
            <p class="ticket-desc"></p>
            <div class="ticket-footer">
                <div class="assignee-info">
                    <span class="label">Assignee:</span>
                    <span class="value t-assignee">Unassigned</span>
                </div>
                <div class="ticket-actions">
                    <button class="btn btn-sm btn-outline claim-btn hidden">Claim</button>
                    <button class="btn btn-sm btn-danger delete-btn hidden">Delete</button>
                </div>
            </div>
        </div>
    </template>

    <!-- Load Stellar SDK and App Logic -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stellar-sdk/11.0.0/stellar-sdk.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stellar/freighter-api@3.0.0/build/index.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
